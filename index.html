<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Veract — Outcome-Metered Settlement Engine on PayPal v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #090e1a;
        background-image: 
          radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.12) 0px, transparent 40%),
          radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.1) 0px, transparent 45%),
          radial-gradient(circle at 50% 90%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        color: #f8fafc;
        overflow-x: hidden;
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }
      /* Premium fintech architectural grid */
      .bg-dot-grid {
        background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      /* Premium glass card with neon specular edge */
      .lovable-card {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(10, 15, 28, 0.95) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 0 0 1px rgba(56, 189, 248, 0.05) inset,
          0 24px 48px -12px rgba(0, 0, 0, 0.7);
      }
      /* Custom vibrant scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #060913;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
        border: 1px solid rgba(56, 189, 248, 0.1);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
      /* Custom dark styling for AG Grid Community */
      .ag-theme-quartz,
      .ag-theme-quartz-dark,
      .ag-root-wrapper,
      .ag-body-viewport,
      .ag-center-cols-viewport {
        background-color: #070b14 !important;
        color: #f8fafc !important;
        --ag-background-color: #070b14 !important;
        --ag-header-background-color: #0b1120 !important;
        --ag-odd-row-background-color: #090e1a !important;
        --ag-row-hover-color: #131c31 !important;
        --ag-foreground-color: #f8fafc !important;
        --ag-header-foreground-color: #94a3b8 !important;
        --ag-border-color: rgba(148, 163, 184, 0.12) !important;
        --ag-row-border-color: rgba(148, 163, 184, 0.08) !important;
        --ag-font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        --ag-font-size: 13px;
        --ag-header-font-size: 11px;
        --ag-header-font-weight: 700;
      }

      .ag-header {
        border-bottom: 1px solid rgba(56, 189, 248, 0.15) !important;
      }

      .ag-row {
        background-color: #070b14 !important;
        color: #e2e8f0 !important;
      }

      .ag-row-hover {
        background-color: #111a2e !important;
      }

      .ag-row-selected {
        background-color: rgba(14, 165, 233, 0.14) !important;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
