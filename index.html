<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veract — Outcome-Metered Settlement Engine on PayPal v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #090e1a;
        background-image: 
          radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.12) 0px, transparent 40%),
          radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.1) 0px, transparent 45%),
          radial-gradient(circle at 50% 90%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        color: #f8fafc;
        overflow-x: hidden;
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }
      /* Premium fintech architectural grid */
      .bg-dot-grid {
        background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      /* Premium glass card with neon specular edge */
      .lovable-card {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(10, 15, 28, 0.95) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 0 0 1px rgba(56, 189, 248, 0.05) inset,
          0 24px 48px -12px rgba(0, 0, 0, 0.7);
      }
      /* Custom vibrant scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #060913;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
        border: 1px solid rgba(56, 189, 248, 0.1);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
      /* Custom dark styling for AG Grid Community */
      .ag-theme-quartz-dark {
        --ag-background-color: rgba(11, 18, 32, 0.75);
        --ag-foreground-color: #f8fafc;
        --ag-header-background-color: rgba(15, 23, 42, 0.95);
        --ag-header-foreground-color: #38bdf8;
        --ag-odd-row-background-color: rgba(15, 23, 42, 0.4);
        --ag-row-hover-color: rgba(14, 165, 233, 0.12);
        --ag-selected-row-background-color: rgba(16, 185, 129, 0.18);
        --ag-border-color: rgba(51, 65, 85, 0.5);
        --ag-font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        --ag-font-size: 13px;
        --ag-header-font-size: 11px;
        --ag-header-font-weight: 700;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
